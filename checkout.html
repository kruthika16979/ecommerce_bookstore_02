<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bookstore</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        h1 { text-align: center; }
        .checkout-container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input, button { display: block; width: 100%; padding: 10px; margin-top: 10px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        <script>
function validateForm() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  if (name === '' || email === '') {
    alert('Please fill in all required fields.');
    return false;
  }
  return true;
}
</script>
    </style>
</head>
<body>
    <h1>Checkout</h1>
<h2>Testing git change</h2>

    <div class="checkout-container">
<form action="process_checkout.php" method="post" onsubmit="return validateform()">        
<label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name">
        
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Enter your address">
        
        <label for="payment">Payment Method:</label>
        <input type="text" id="payment" placeholder="Enter payment method">
        
        <button onclick="placeOrder()">Place Order</button>
    </div>
    <script>
        function placeOrder() {
            alert("please complete all checkout details before placing orders.");
            localStorage.removeItem("cart");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
