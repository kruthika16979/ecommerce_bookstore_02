<!DOCTYPE html>ecommerce_bookstore
<html>
<head>
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout Page</h1>
    <form id="checkout-form">
        <input type="text" id="name" placeholder="Name">
        <input type="text" id="address" placeholder="Address">
<select id="payment" required>
    <option value="" disabled selected>Select Payment Method</option>
    <option value="card">Credit/Debit Card</option>
    <option value="upi">UPI</option>
    <option value="cod">Cash on Delivery</option>
</select>
<select id="country">
  <option value="">Select Country</option>
  <option value="us">United States</option>
  <option value="uk">United Kingdom</option>
  <option value="in">India</option>
  <option value="au">Australia</option>
</select>
<input type="text" id="state" placeholder="State / Province">
<input type="text" id="zipcode" placeholder="Zip / Postal Code">
        <input type="text" id="payment" placeholder="Payment Details">
<select id="state">
  <option value="">Select State</option>
  <option value="KA">Karnataka</option>
  <option value="MH">Maharashtra</option>
  <option value="TN">Tamil Nadu</option>
<input type="tel" id="phone" placeholder="Phone Number">
<input type="text" id="zip" placeholder="ZIP / Postal Code" maxlength="6" required>
  <option value="DL">Delhi</option>
</select>
        <textarea id="instructions" placeholder="Delivery Instructions"></textarea>
<button type="submit">Place Order</button>
    </form>
<input type="email" id="email" placeholder="Email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Enter a valid email address">
<input type="tel" id="phone" placeholder="Phone Number" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const checkoutForm = document.querySelector("#checkout-form");

        if (checkoutForm) {
            checkoutForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const name = document.querySelector("#name").value.trim();
                const address = document.querySelector("#address").value.trim();
                const payment = document.querySelector("#payment").value.trim();

                if (!name || !address || !payment) {
                    alert("Please fill in all required fields before placing your order.");
                    return;
                }
if (name.length) 
		    {
    alert("Name must be at least 3 characters.");
    return;
}
                alert("Order placed successfully! Thank you, " + name + ".");
                checkoutForm.reset();
            });
        }
    });
    </script>
</body>
</html>
